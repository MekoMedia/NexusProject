<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>423 Locked - Resource Unavailable</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 1.25rem;
        }

        .error-container {
            max-width: 500px;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .lock-icon {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 800;
            color: #1e293b;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="lock-icon">🔒</div>
        <h1>423</h1>
        <h2>Resource Locked</h2>
        <p>The requested file or database entity is currently being modified by another process or user session. Please wait a few moments and try your request again.</p>
        <a href="/" class="btn">Return Home</a>
    </div>

</body>
</html>
